# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Kaurmd-messenger-staging

on:
  push:
    branches:
      - lab2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v3
        with:
          auth-type: "SERVICE_PRINCIPAL"
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A8AF92C287ED44C9B921C136FD33B5D7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1C5966BDC64F4BD49841DB1D2DCC6ACB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_85D53CB2900449AAA3C998BA46283195 }}
          client-secret: ${{ secrets.AZUREAPPSERVICE_CLIENTSECRET_A8AF92C287ED44C9B921C136FD33B5D7 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Kaurmd-messenger-staging'
          slot-name: 'Production'
          package: .
          
